(function(G){
  'use strict';
  const A=G.APP, V=G.VDM, S=A.Store, App=A.App;
  const $=(s,r)=> (r||document).querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const isGM=()=>!!(App.member&&App.member.role==='gm');
  const worldTypes=[['npc','NPCs'],['lugar','Lugares'],['faccao','Facções'],['missao','Missões'],['nota','Diário'],['handout','Handouts'],['navio','Navios']];
  const secretKey=()=>`vdm:segredos:${App.room?App.room.id:'solo'}`;
  const secrets=()=>{try{return JSON.parse(G.localStorage.getItem(secretKey())||'{}')}catch(e){return {}}};
  const saveSecrets=o=>{try{G.localStorage.setItem(secretKey(),JSON.stringify(o))}catch(e){}};
  const gmWorldKey=()=>`vdm:mundo-mestre:${App.room?App.room.id:'solo'}`;
  const loadGMWorld=()=>{try{return JSON.parse(G.localStorage.getItem(gmWorldKey())||'[]')}catch(e){return []}};
  const saveGMWorld=a=>{try{G.localStorage.setItem(gmWorldKey(),JSON.stringify(a))}catch(e){}};
  const mergeWorld=(priv,pub)=>{const map=new Map((priv||[]).map(x=>[x.id,x]));(pub||[]).forEach(x=>{if(!map.has(x.id))map.set(x.id,Object.assign({visible:true},x));});return Array.from(map.values())};
  const initialCombat=()=>({active:false,round:1,turn:'',items:[]});
  App.extraState={world:[],combat:initialCombat(),worldType:'npc',ruleQuery:'',ruleSection:'all'};
  App.receiveExtra=function(item){
    if(!item||!item.payload)return;
    if(item.kind==='vdm_world_state'){const pub=Array.isArray(item.payload.items)?item.payload.items:[];this.extraState.world=isGM()?mergeWorld(loadGMWorld(),pub):pub.map(x=>Object.assign({visible:true},x));if(this.tab==='mundo')this.renderTab();}
    if(item.kind==='vdm_combat_state'){this.extraState.combat=Object.assign(initialCombat(),item.payload.data||{});if(this.tab==='combate')this.renderTab();}
  };          
const oldSub=S.subscribeFeed;
  S.subscribeFeed=function(code,cb){return oldSub.call(this,code,item=>{App.receiveExtra(item);cb(item);});};
  const oldEnter=App.enterRoom;
  App.enterRoom=async function(code,member){
    await oldEnter.call(this,code,member);
    const feed=this.feed||[];
    const w=feed.filter(x=>x.kind==='vdm_world_state').pop();
    const c=feed.filter(x=>x.kind==='vdm_combat_state').pop();
    const pubWorld=w&&w.payload&&Array.isArray(w.payload.items)?w.payload.items:[];this.extraState.world=isGM()?mergeWorld(loadGMWorld(),pubWorld):pubWorld.map(x=>Object.assign({visible:true},x));
    this.extraState.combat=Object.assign(initialCombat(),c&&c.payload&&c.payload.data||{});
    this.renderTab();
  };
  App.saveWorldState=async function(){
    if(!isGM())return this.toast('Somente o mestre pode editar o Mundo.',true);
    const items=this.extraState.world.map(x=>({id:x.id,type:x.type,name:x.name,description:x.description||'',status:x.status||'',model:x.model||'',crew:x.crew||'',visible:!!x.visible}));
    saveGMWorld(items);
    const publicItems=items.filter(x=>x.visible).map(x=>({id:x.id,type:x.type,name:x.name,description:x.description,status:x.status,model:x.model,crew:x.crew,visible:true}));
    try{await S.postFeed(this.room.id,{author:this.member.name,kind:'vdm_world_state',payload:{items:publicItems,updatedAt:Date.now()}});this.extraState.world=items;this.toast('Mundo salvo. Itens revelados foram sincronizados com a mesa.');}
    catch(e){this.toast('Não foi possível sincronizar o Mundo: '+e.message,true);}
  };
  App.saveCombatState=async function(){
    if(!isGM())return this.toast('Somente o mestre pode controlar o combate.',true);
    const data=JSON.parse(JSON.stringify(this.extraState.combat));
    try{await S.postFeed(this.room.id,{author:this.member.name,kind:'vdm_combat_state',payload:{data,updatedAt:Date.now()}});this.extraState.combat=data;}
    catch(e){this.toast('Não foi possível salvar o combate: '+e.message,true);}
  };
  App.renderMundo=function(){
    const state=this.extraState, type=state.worldType||'npc', list=state.world.filter(x=>x.type===type), gm=isGM(), sec=secrets();
    const typeLabel=(worldTypes.find(x=>x[0]===type)||[])[1]||'Mundo';
    const cards=list.length?list.map(x=>`<article class="cartao"><header><h4>${esc(x.name)}</h4><span class="tag">${gm?(x.visible?'Revelado':'Oculto')+' · ':''}${esc(x.status||typeLabel)}</span></header><p class="texto">${esc(x.description||'Sem descrição pública.')}</p>${gm&&sec[x.id]?`<details class="segredo"><summary>Nota privada do mestre</summary><p class="texto">${esc(sec[x.id])}</p></details>`:''}${gm?`<div class="acoes"><button class="btn mini" data-world-edit="${esc(x.id)}">Editar</button><button class="btn mini ghost" data-world-toggle="${esc(x.id)}">${x.visible?'Ocultar':'Revelar'}</button><button class="btn mini ghost" data-world-secret="${esc(x.id)}">Nota privada</button><button class="btn mini perigo" data-world-del="${esc(x.id)}">Excluir</button></div>`:''}</article>`).join(''):'<div class="vazio"><h4>Nenhum registro nesta seção</h4><p>Adicione ilhas, personagens, organizações, missões e outros elementos da campanha.</p></div>';
    const shipRows=V.NAVIOS.map(row=>`<tr>${row.map((v,i)=>`<${i===0?'th':'td'}>${esc(v)}</${i===0?'th':'td'}>`).join('')}</tr>`).join('');
    $('#tab-content').innerHTML=`<header class="tab-cab"><h2>Mundo</h2>${gm?'<button class="btn primario" id="world-add">＋ Novo registro</button>':''}</header>
      <nav class="subabas">${worldTypes.map(([id,label])=>`<button class="subaba ${type===id?'on':''}" data-world-type="${id}">${label} <small>${state.world.filter(x=>x.type===id).length}</small></button>`).join('')}</nav>
      <section class="card"><div class="barra-busca"><input id="world-search" type="search" placeholder="Buscar em ${typeLabel.toLowerCase()}…"><span class="dica">${gm?'Registros ocultos ficam no navegador do mestre; use Revelar para compartilhar.':'Você vê os registros publicados pelo mestre.'}</span></div><div class="cards" id="world-cards">${cards}</div></section>
      <section class="card"><h3>Tabela de navios</h3><p class="dica">Características dos modelos de embarcação disponíveis no sistema.</p><div class="tabela-wrap"><table class="tabela"><thead><tr>${V.NAVIO_COLS.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${shipRows}</tbody></table></div>
      <h3 class="sub">Regras navais</h3><div class="lista-simples">${V.REGRAS_NAVAL.map(x=>`<p><b>${esc(x[0])}:</b> ${esc(x[1])}</p>`).join('')}</div>
      <h3 class="sub">Manobras</h3><div class="lista-simples">${V.MANOBRAS.map(x=>`<p><b>${esc(x[0])}</b> <small>· ${esc(x[1])}</small><br>${esc(x[3])}</p>`).join('')}</div></section>`;
    $$('[data-world-type]').forEach(b=>b.onclick=()=>{state.worldType=b.dataset.worldType;this.renderMundo();});
    const redrawSearch=()=>{const q=norm($('#world-search')?.value||'');$('#world-cards').innerHTML=state.world.filter(x=>x.type===type&&(!q||norm(x.name+' '+x.description+' '+x.status).includes(q))).map(x=>`<article class="cartao"><header><h4>${esc(x.name)}</h4><span class="tag">${gm?(x.visible?'Revelado':'Oculto')+' · ':''}${esc(x.status||typeLabel)}</span></header><p class="texto">${esc(x.description||'Sem descrição pública.')}</p>${gm&&sec[x.id]?`<details class="segredo"><summary>Nota privada do mestre</summary><p>${esc(sec[x.id])}</p></details>`:''}${gm?`<div class="acoes"><button class="btn mini" data-world-edit="${esc(x.id)}">Editar</button><button class="btn mini ghost" data-world-toggle="${esc(x.id)}">${x.visible?'Ocultar':'Revelar'}</button><button class="btn mini ghost" data-world-secret="${esc(x.id)}">Nota privada</button><button class="btn mini perigo" data-world-del="${esc(x.id)}">Excluir</button></div>`:''}</article>`).join('')||'<div class="vazio">Nenhum resultado encontrado.</div>';bindCards();};
    const bindCards=()=>{
      $$('[data-world-edit]').forEach(b=>b.onclick=()=>this.editWorld(b.dataset.worldEdit));
      $$('[data-world-toggle]').forEach(b=>b.onclick=()=>{const x=state.world.find(y=>y.id===b.dataset.worldToggle);if(!x)return;x.visible=!x.visible;this.saveWorldState().then(()=>this.renderMundo());});
      $$('[data-world-secret]').forEach(b=>b.onclick=()=>{const id=b.dataset.worldSecret,o=secrets(),v=G.prompt('Nota privada do mestre (não é compartilhada):',o[id]||'');if(v!==null){o[id]=v;saveSecrets(o);this.renderMundo();}});
      $$('[data-world-del]').forEach(b=>b.onclick=async()=>{if(!G.confirm('Excluir este registro do Mundo?'))return;state.world=state.world.filter(x=>x.id!==b.dataset.worldDel);await this.saveWorldState();this.renderMundo();});
    };
    $('#world-search')?.addEventListener('input',redrawSearch);bindCards();
    if($('#world-add'))$('#world-add').onclick=()=>this.editWorld(null);
  };
  App.editWorld=function(id){
    if(!isGM())return;
    const s=this.extraState,old=s.world.find(x=>x.id===id)||{type:s.worldType,name:'',description:'',status:''};
    const name=G.prompt('Nome do registro:',old.name);if(name===null)return;if(!name.trim())return this.toast('Informe um nome.',true);
    const description=G.prompt('Descrição pública para a mesa:',old.description||'');if(description===null)return;
    const status=G.prompt('Categoria, situação ou detalhe curto (opcional):',old.status||'');if(status===null)return;
    const item=Object.assign({},old,{id:old.id||('w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),type:s.worldType,name:name.trim(),description,status,visible:!!old.visible});
    if(old.id)s.world=s.world.map(x=>x.id===old.id?item:x);else s.world.push(item);
    this.saveWorldState().then(()=>this.renderMundo());
  };
  App.renderRegras=function(){
    const q=this.extraState.ruleQuery||'',sec=this.extraState.ruleSection||'all';
    const all=[], add=(section,group,name,text)=>all.push({section,group,name,text:String(text||'')});
    V.REGRAS.forEach(group=>group[2].forEach(x=>add('regras',group[1],x[0],x[1])));
    V.CONDICOES.forEach(x=>add('condicoes','Condições',x[0],x[1]));
    V.DANOS.forEach(x=>add('danos',x[1],x[0],x[2]==='F'?'Ao zerar a Vida, sugere Ferimento permanente.':x[2]==='L'?'Ao zerar a Vida, sugere Lesão permanente.':'Consulte a regra de dano e a decisão do mestre.'));
    V.PROPRIEDADES.forEach(x=>add('armas','Propriedades de armas',x[0],x[1]));
    V.ESPECIALIZACOES.forEach(x=>add('competencias','Especializações',x[0],x[1]));
    V.APTIDOES.forEach(x=>add('aptidoes',x[2],x[0],'Atributos relacionados: '+x[1].join(', ')+'.'));
    V.APT_NIVEIS.forEach((x,i)=>add('aptidoes','Níveis de aptidão','Nível '+i,x));
    V.COMPETENCIAS.forEach(x=>add('competencias','Grupos',x[0],x[1].join(', ')+'.'));
    V.COMP_NIVEIS.forEach((x,i)=>add('competencias','Níveis de competência','Nível '+i,x));
    Object.keys(V.CLASSES).forEach(k=>add('classes','Classes',V.CLASSES[k].n,'Vida inicial '+V.CLASSES[k].vida+' · Vigor inicial '+V.CLASSES[k].vigor+'.'));
    Object.keys(V.ESTILOS).forEach(k=>add('classes','Estilos de luta',k,V.ESTILOS[k].join(', ')+'.'));
    V.POTENCIAIS.forEach(p=>add('potenciais','Potenciais',p.n,(p.v?'Valores: '+p.v.join(', ')+'. ':p.fixo?'Atributos fixos. ':p.livres?p.livres+' pontos livres. ':'')+p.x));
    add('potenciais','Potenciais','Potenciais excepcionais',V.POT_EXCEPCIONAIS);
    Object.keys(V.EQUIP).forEach(tipo=>V.EQUIP[tipo].forEach(it=>add('equipamento',it.g||tipo,it.n,[it.d,it.x,it.p?it.p+' kg':'',it.b?'B$'+it.b:''].filter(Boolean).join(' · '))));
    V.HAB_MUNDO.forEach(x=>add('habilidades','Habilidades do mundo',x[0],x[1]+' PH'));
    V.NAVIOS.forEach(x=>add('naval','Navios',x[0],'Tamanho '+x[1]+' · carga '+x[2]+' t · tripulação '+x[3]+' · '+x[4]+' nós · '+x[5]+' canhões · Vida '+x[6]+' · Resistência '+x[7]+' · CA '+x[8]));
    V.MANOBRAS.forEach(x=>add('naval','Manobras navais',x[0],x[1]+'. '+x[3]));
    V.REGRAS_NAVAL.forEach(x=>add('naval','Regras navais',x[0],x[1]));
    add('povos','Povos','Raças',V.RACAS.join(', ')+'.');add('povos','Povos','Tribos',V.TRIBOS.join(', ')+'.');add('povos','Profissões','Profissões',V.PROFISSOES.join(', ')+'.');
    V.NIVEL_CLASSE.forEach(x=>add('progressao','Classe','Nível '+x[0],'Don '+x[1]+' · '+x[2]));
    V.NIVEL_PROF.forEach(x=>add('progressao','Profissão','Nível '+x[0],x[1]));
    V.NIVEL_FRUTA.forEach(x=>add('progressao','Akuma no Mi','Nível '+x[0],x[1]));
    const tokens=norm(q).split(/\s+/).filter(Boolean);
    const found=all.filter(x=>(sec==='all'||x.section===sec)&&tokens.every(t=>norm(x.name+' '+x.group+' '+x.text).includes(t)));
    const sections=[['all','Tudo'],['regras','Regras gerais'],['condicoes','Condições'],['danos','Tipos de dano'],['armas','Propriedades de armas'],['competencias','Competências e especializações'],['aptidoes','Aptidões'],['classes','Classes e estilos'],['potenciais','Potenciais'],['equipamento','Equipamento'],['habilidades','Habilidades'],['naval','Navios e mar'],['povos','Raças e profissões'],['progressao','Progressão']];
    $('#tab-content').innerHTML=`<header class="tab-cab"><h2>Regras do sistema</h2><span class="tag">${found.length} resultados</span></header>
      <div class="barra-busca"><input id="rules-search" type="search" value="${esc(q)}" placeholder="Buscar regra, condição, arma, aptidão, navio…"><select id="rules-section">${sections.map(x=>`<option value="${x[0]}" ${sec===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
      <div id="rules-list">${found.length?found.map(x=>`<article class="regra"><header><h4>${esc(x.name)}</h4><small>${esc(x.group)}</small></header><p>${esc(x.text)}</p></article>`).join(''):'<div class="vazio">Nenhuma regra encontrada. Tente outro termo.</div>'}</div>
      <section class="card"><h3>Tabelas de progressão</h3><div class="tabela-wrap"><table class="tabela"><thead><tr><th>Nível de classe</th><th>Don</th><th>Ganhos</th></tr></thead><tbody>${V.NIVEL_CLASSE.map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td><td>${esc(x[2])}</td></tr>`).join('')}</tbody></table></div>
      <div class="tabela-wrap"><table class="tabela"><thead><tr><th>Nível de profissão</th><th>Ganhos</th></tr></thead><tbody>${V.NIVEL_PROF.map(x=>`<tr><th>${x[0]}</th><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table></div>
      <div class="tabela-wrap"><table class="tabela"><thead><tr><th>Nível de fruta</th><th>Ganhos</th></tr></thead><tbody>${V.NIVEL_FRUTA.map(x=>`<tr><th>${x[0]}</th><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table></div></section>
      <p class="dica">Compêndio ampliado com o conteúdo de regras e tabelas disponível no arquivo de referência. Caso o livro/PDF tenha capítulos adicionais, eles não estão incluídos automaticamente.</p>`;
    $('#rules-search').oninput=e=>{this.extraState.ruleQuery=e.target.value;this.renderRegras();const el=$('#rules-search');el.focus();el.setSelectionRange(el.value.length,el.value.length);};
    $('#rules-section').onchange=e=>{this.extraState.ruleSection=e.target.value;this.renderRegras();};
  };
  App.renderMestre=function(){
    const generators=[
      ['Nome de pirata',()=>pick(V.NOMES_A)+' '+pick(V.NOMES_B)],
      ['Nome de pessoa',()=>pick(V.NOMES_P)],
      ['Evento no mar',()=>pick(V.EVENTOS_MAR)],
      ['Nome de navio',()=>pick(V.NOMES_A)+' '+pick([' dos Mares',' do Amanhecer',' da Tempestade',' do Horizonte',' da Fortuna',' da Liberdade'])],
      ['Nome de ilha',()=>pick(['Ilha de '+pick(V.NOMES_P),'Porto '+pick(V.NOMES_A),'Atol '+pick(V.NOMES_B),'Arquipélago de '+pick(V.NOMES_P)])]
    ];
    $('#tab-content').innerHTML=`<header class="tab-cab"><h2>Ferramentas do mestre</h2></header><section class="card"><h3>Geradores</h3><p class="dica">Gere nomes e acontecimentos para improvisar durante a campanha.</p>${generators.map((g,i)=>`<div class="gerador"><b>${g[0]}</b><output class="gerado" id="gen-${i}">—</output><div class="acoes"><button class="btn mini primario" data-gen="${i}">🎲 Sortear</button><button class="btn mini ghost" data-copy-gen="${i}">Copiar</button><button class="btn mini ghost" data-send-gen="${i}">Enviar à mesa</button></div></div>`).join('')}</section>
      <section class="card"><h3>Orientações da mesa</h3><p>Use a aba Mundo para registrar lugares, NPCs, facções, missões, diário, handouts e navios. Os registros públicos são sincronizados para os participantes.</p><p class="dica">As notas privadas do mestre ficam apenas neste navegador. Para manter segredos entre dispositivos, será necessário configurar uma área privada própria no banco de dados.</p></section>`;
    generators.forEach((g,i)=>{const out=$('#gen-'+i);$$('[data-gen="'+i+'"]').forEach(b=>b.onclick=()=>out.textContent=g[1]());$$('[data-copy-gen="'+i+'"]').forEach(b=>b.onclick=()=>{if(out.textContent!=='—')G.navigator.clipboard?.writeText(out.textContent).then(()=>this.toast('Copiado.'));});$$('[data-send-gen="'+i+'"]').forEach(b=>b.onclick=()=>{if(out.textContent!=='—')S.postFeed(this.room.id,{author:this.member.name,kind:'chat',payload:{text:g[0]+': '+out.textContent}}).then(()=>this.toast('Enviado à mesa.')).catch(e=>this.toast(e.message,true));});});
  };
  App.renderCombate=function(){
    const e=this.extraState.combat,gm=isGM();
    const order=e.items.slice().sort((a,b)=>Number(b.ini)-Number(a.ini)||Number(b.agi||0)-Number(a.agi||0)||a.name.localeCompare(b.name));
    const current=order.find(x=>x.id===e.turn);
    $('#tab-content').innerHTML=`<header class="tab-cab"><h2>${e.active?'Combate · rodada '+e.round:'Tracker de combate'}</h2>${gm?`<div class="acoes">${e.active?'<button class="btn mini" id="combat-prev">Turno anterior</button><button class="btn mini primario" id="combat-next">Próximo turno</button><button class="btn mini perigo" id="combat-end">Encerrar</button>':'<button class="btn primario" id="combat-start">Iniciar combate</button>'}</div>`:''}</header>
      ${current&&e.active?`<div class="faixa-vez"><b>Vez de ${esc(current.name)}</b> · Iniciativa ${Number(current.ini)||0}</div>`:''}
      ${gm?`<section class="card"><h3>Adicionar participante</h3><div class="grade"><label>Nome<input id="combat-name" placeholder="Personagem ou inimigo"></label><label>Modificador de iniciativa<input id="combat-mod" type="number" value="0"></label><label>Vida máxima<input id="combat-hpmax" type="number" value="20" min="1"></label><label>CA<input id="combat-ca" type="number" value="10"></label></div><div class="acoes"><button class="btn mini primario" id="combat-roll-add">Rolar iniciativa e adicionar</button><button class="btn mini" id="combat-manual-add">Adicionar com iniciativa manual</button></div></section>`:''}
      <section class="card"><h3>Ordem de iniciativa</h3>${order.length?order.map(x=>`<article class="comb-linha ${e.active&&x.id===e.turn?'ativo':''}"><div class="ini">${Number(x.ini)||0}</div><div class="info"><b>${esc(x.name)}</b><small>${esc(x.kind||'Participante')} · CA ${Number(x.ca)||10} · Vida ${Number(x.hp)||0}/${Number(x.hpmax)||0}</small><div class="barra"><i style="width:${Math.max(0,Math.min(100,100*(Number(x.hp)||0)/Math.max(1,Number(x.hpmax)||1)))}%"></i></div></div>${gm?`<div class="acoes"><button class="btn mini" data-hp="${esc(x.id)}" data-delta="-1">− Vida</button><button class="btn mini" data-hp="${esc(x.id)}" data-delta="1">+ Vida</button><button class="btn mini perigo" data-combat-del="${esc(x.id)}">✕</button></div>`:''}</article>`).join(''):'<div class="vazio">Nenhum participante. Adicione personagens e inimigos para montar a ordem de iniciativa.</div>'}</section>
      ${!gm?'<p class="dica">O mestre controla a ordem, os turnos e os pontos de vida deste combate.</p>':''}`;
    if(!gm)return;
    const persist=()=>this.saveCombatState();
    const add=(manual)=>{
      const name=$('#combat-name').value.trim();if(!name)return this.toast('Digite o nome do participante.',true);
      const mod=Number($('#combat-mod').value)||0,roll=manual?null:V.d20(0),ini=manual?Number(G.prompt('Valor de iniciativa:','10')):roll.v+mod;
      if(ini===null||!Number.isFinite(ini))return;
      e.items.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,kind:'Participante',ini,agi:mod,hp:Number($('#combat-hpmax').value)||20,hpmax:Number($('#combat-hpmax').value)||20,ca:Number($('#combat-ca').value)||10});
      e.items.sort((a,b)=>b.ini-a.ini);if(!e.turn)e.turn=e.items[0].id;persist().then(()=>this.renderCombate());
    };
    $('#combat-roll-add').onclick=()=>add(false);$('#combat-manual-add').onclick=()=>add(true);
    $('#combat-import-chars')?.addEventListener('click',async()=>{
      try{
        const chars=await S.getAllCharacters(this.room.id),known=new Set(e.items.map(x=>x.ref).filter(Boolean));
        let count=0;
        chars.forEach(rec=>{
          const d=rec.data||{},calc=V.calc(d),ref=rec.user_id||rec.id;
          if(!d.nome||known.has(ref))return;
          const roll=V.d20(0),agi=Number(calc.agiE)||0;
          e.items.push({id:'pc:'+ref,ref,name:d.nome,kind:'Jogador',ini:roll.v+agi,hp:d.vidaAtual==null?calc.vidaTotal:Number(d.vidaAtual),hpmax:calc.vidaTotal,ca:calc.CA,agi});
          known.add(ref);count++;
        });
        if(!count)return this.toast('Não há novas fichas para importar.');
        if(!e.turn)e.turn=e.items.slice().sort((a,b)=>b.ini-a.ini)[0].id;
        await persist();this.renderCombate();this.toast(count+' personagem(ns) importado(s).');
      }catch(err){this.toast('Erro ao importar fichas: '+err.message,true);}
    });
    $('#combat-start')?.addEventListener('click',()=>{if(!order.length)return this.toast('Adicione participantes primeiro.',true);e.active=true;e.round=1;e.turn=order[0].id;persist().then(()=>this.renderCombate());});
    $('#combat-next')?.addEventListener('click',()=>{const i=order.findIndex(x=>x.id===e.turn),n=(i+1)%order.length;if(i>=0&&n===0)e.round++;e.turn=order[n].id;persist().then(()=>this.renderCombate());});
    $('#combat-prev')?.addEventListener('click',()=>{const i=order.findIndex(x=>x.id===e.turn),n=(i<=0?order.length-1:i-1);if(i===0)e.round=Math.max(1,e.round-1);e.turn=order[n].id;persist().then(()=>this.renderCombate());});
    $('#combat-end')?.addEventListener('click',()=>{if(!G.confirm('Encerrar o combate e limpar o tracker?'))return;this.extraState.combat=initialCombat();persist().then(()=>this.renderCombate());});
    $$('[data-combat-del]').forEach(b=>b.onclick=()=>{e.items=e.items.filter(x=>x.id!==b.dataset.combatDel);if(e.turn===b.dataset.combatDel)e.turn='';persist().then(()=>this.renderCombate());});
    $$('[data-hp]').forEach(b=>b.onclick=()=>{const x=e.items.find(y=>y.id===b.dataset.hp);if(!x)return;x.hp=Math.max(0,Math.min(x.hpmax,x.hp+Number(b.dataset.delta)));persist().then(()=>this.renderCombate());});
  };
  App.renderTab=function(){
    if(this.tab==='ficha')this.renderFicha();
    else if(this.tab==='mesa')this.renderMesa();
    else if(this.tab==='mundo')this.renderMundo();
    else if(this.tab==='regras')this.renderRegras();
    else if(this.tab==='mestre')this.renderMestre();
    else if(this.tab==='combate')this.renderCombate();
  };
  const oldRoom=App.renderRoom;
  App.renderRoom=function(){
    oldRoom.call(this);
    const nav=$('.abas');
    const tabs=[['combate','⚔️ Combate'],['mundo','🌍 Mundo'],['regras','📖 Regras'],['mestre','🧭 Mestre']];
    tabs.forEach(([id,label])=>{const b=document.createElement('button');b.type='button';b.className='aba'+(this.tab===id?' on':'');b.dataset.tab=id;b.textContent=label;b.setAttribute('aria-selected',this.tab===id?'true':'false');b.onclick=()=>{this.tab=id;this.renderRoom();};nav.appendChild(b);});
  };
  const oldFeed=App.renderFeed;
  App.renderFeed=function(){
    const el=$('#feed');if(!el)return;
    const visible=(this.feed||[]).filter(x=>x.kind!=='vdm_world_state'&&x.kind!=='vdm_combat_state');
    el.innerHTML=visible.map(x=>this.feedItemHTML(x)).join('');el.scrollTop=el.scrollHeight;
  };
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<style>
:root{--bg:#f4eedd;--bg2:#ece3cd;--card:#fbf8ef;--inp:#fffdf7;--fg:#1b2a3a;--mut:#5a6a79;--line:#dccfb3;--accent:#0d6b78;--accent-fg:#fff;--vida:#c2412f;--vigor:#2f7fb8;--ok:#2b7a4b;--bad:#b42318;--sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;--display:'Pirata One',serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b1520;--bg2:#101e2b;--card:#14232f;--inp:#0f1c27;--fg:#e5edf4;--mut:#94a7b7;--line:#263a4b;--accent:#4dbccc;--accent-fg:#06222a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding:0 max(16px,env(safe-area-inset-left,0px)) 40px}
h1,h2,h3,h4{margin:0}
h1{font:400 2rem/1.1 var(--display)}
h2{font:400 1.6rem/1.2 var(--display)}
h3{font:400 1.3rem/1.2 var(--display);color:var(--accent);margin-bottom:10px}
h4{font-size:.8rem;margin:16px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primario{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.mini{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn.perigo{color:var(--bad);border-color:var(--bad);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hint{color:var(--mut);font-size:.85rem}
label{display:block;font-size:.85rem;color:var(--mut);font-weight:600}
label>input,label>select{margin-top:4px;font-weight:400;color:var(--fg)}
.login{max-width:420px;margin:10vh auto 0;padding:0 16px;text-align:center}
.login h1{font-size:2.6rem;margin-bottom:0}
.login .sub{color:var(--mut);margin:4px 0 20px}
.login .card{text-align:left}
.login-actions{margin-top:16px;display:grid;gap:10px}
.divider{text-align:center;color:var(--mut);font-size:.85rem}
.join-row{display:flex;gap:6px}
.join-row input{text-transform:uppercase}
.login .hint{margin-top:16px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 8px;max-width:1200px;margin:0 auto}
.topo .marca h1{font-size:1.5rem}
.topo .direita{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;background:var(--card)}
.pill.gm{border-color:var(--accent);color:var(--accent)}
.room-bar{display:flex;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;max-width:1200px;margin:0 auto 16px;font-size:.9rem}
.room-bar .code{font-family:var(--mono);font-weight:700;letter-spacing:.1em;color:var(--accent)}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto 16px}
.aba{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.aba.on{color:var(--accent);border-bottom-color:var(--accent)}
#tab-content{max-width:1200px;margin:0 auto}
.ficha-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.save-status{font-size:.85rem;color:var(--mut)}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:8px}
.atr-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 80px;gap:6px;align-items:center;margin-bottom:8px}
.atr-head{font-size:.72rem;text-transform:uppercase;color:var(--mut);font-weight:700;letter-spacing:.04em}
.atr-row{display:contents}
.atr-row label{font-weight:400;color:var(--fg);font-size:.92rem}

(function(G){
  const V = G.VDM = {};
  const n = x => Number.isFinite(+x) ? +x : 0;
  V.n = n;
  V.clamp = (x,a,b) => Math.min(b, Math.max(a,x));
  function rnd(k){
    k = Math.max(1, Math.trunc(k));
    const c = G.crypto;
    if (c && c.getRandomValues){
      const lim = Math.floor(4294967296/k)*k, a = new Uint32Array(1);
      do { c.getRandomValues(a); } while (a[0] >= lim);
      return (a[0] % k) + 1;
    }
    return Math.floor(Math.random()*k)+1;
  }
  V.rnd = rnd;
  V.parseExpr = function(expr){
    const s = String(expr||'').replace(/\s+/g,'').toLowerCase();
    if (!s) return null;
    const re = /([+-]?)(?:(\d*)d(\d+|%)(?:k([hl])(\d+))?|(\d+))/y;
    const terms = []; let i = 0;
    while (i < s.length){
      re.lastIndex = i;
      const m = re.exec(s);
      if (!m || (i > 0 && !m[1])) return null;
      const sign = m[1] === '-' ? -1 : 1;
      if (m[6] !== undefined) terms.push({sign, flat:+m[6]});
      else {
        const cnt = m[2] === '' ? 1 : +m[2], sides = m[3] === '%' ? 100 : +m[3];
        if (cnt < 1 || cnt > 100 || sides < 1 || sides > 1000) return null;
        terms.push({sign, n: cnt, sides, keep: m[4] ? {mode: m[4], k: Math.min(+m[5], cnt)} : null});
      }
      i = re.lastIndex;
    }
    return terms;
  };
  V.rollTerms = function(terms, o){
    o = o || {};
    const groups = []; let flat = 0, total = 0;
    for (const t of terms){
      if (t.flat !== undefined){ flat += t.sign*t.flat; total += t.sign*t.flat; continue; }
      const r = [];
      for (let i = 0; i < t.n*(o.dobro?2:1); i++) r.push(rnd(t.sides));
      let kept = r.map((_,i)=>i);
      if (t.keep){
        const ord = r.map((_,i)=>i).sort((a,b)=>(t.keep.mode==='h'?r[b]-r[a]:r[a]-r[b]));
        kept = ord.slice(0, t.keep.k);
      }
      const sum = kept.reduce((a,i)=>a+r[i], 0);
      const g = {e: r.length+'d'+t.sides, r, s: t.sign};
      if (kept.length !== r.length) g.k = kept.sort((a,b)=>a-b);

      total += t.sign*sum;
    }
    return {groups, flat, total};
  };

    {k:'CON',n:'Conhecimento'},{k:'RAC',n:'Raciocínio'},{k:'VON',n:'Vontade'},{k:'DST',n:'Destino'},
    {k:'VEL',n:'Velocidade'},{k:'RSL',n:'Resiliência'}

    guerrilheiro:{n:'Guerrilheiro',vida:10,vigor:6},
    artista_marcial:{n:'Artista Marcial',vida:8,vigor:8},
    espadachim:{n:'Espadachim',vida:8,vigor:8},
    atirador:{n:'Atirador',vida:6,vigor:10},
    especialista:{n:'Especialista',vida:6,vigor:10},
    assassino:{n:'Assassino',vida:4,vigor:12},

  };
  V.calc = function(s){
    const A = {};
    V.ATTR_MAIN.forEach(a => { const x = (s.atr && s.atr[a.k]) || {}; A[a.k] = n(x.b) + n(x.m); });
    const ex = V.clamp(Math.trunc(n(s.exaustao)), 0, 10);
    const D = {AGI:A.DES+A.VEL, RES:A.FOR+A.RSL, PER:A.CON+A.VIT, DIS:A.RAC+A.VON, CAR:A.APA+A.DST};
    Object.keys(D).forEach(k => { D[k] += n(s.dm && s.dm[k]); });
    const don = V.don(s.nivel) + n(s.donExtra);
    const agiE = D.AGI - ex, resE = D.RES - ex;
    const CA = 1 + Math.max(agiE, resE) + n(s.caBonus);
    const CD = don + Math.max(D.PER, D.DIS) - ex + n(s.cdBonus);
    const cl = V.CLASSES[s.classe];
    const vb = cl ? cl.vida : 6, gb = cl ? cl.vigor : 6;
    const vidaTotal = Math.max(0, vb + D.RES + n(s.vidaBonus));
    const vigorTotal = Math.max(0, gb + D.PER + n(s.vigorBonus));
    return {A, D, ex, don, CA, CD, vidaTotal, vigorTotal, agiE, resE};
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

// ==========================================================================
// STORE (Supabase)
// ==========================================================================
(function(G){
  const A = G.APP = G.APP || {};
  const S = A.Store = {
    client: null, user: null,
    async init(){
      this.client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      let { data: { user } } = await this.client.auth.getUser();
      if (!user){
        const { data, error } = await this.client.auth.signInAnonymously();
        if (error) throw error;
        user = data.user;
      }
      this.user = user;
    },
    genCode(){
      const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      const arr = new Uint32Array(6); crypto.getRandomValues(arr);
      let s = '';
      for (let i = 0; i < 6; i++) s += ALPHA[arr[i] % ALPHA.length];
      return s;
    },
    async createRoom(name){
      const code = this.genCode();
      const e1 = (await this.client.from('rooms').insert({id:code, gm_id:this.user.id, gm_name:name})).error;
      if (e1) throw e1;
      const e2 = (await this.client.from('members').insert({user_id:this.user.id, room_id:code, name, role:'gm'})).error;
      if (e2) throw e2;
      return code;
    },
    async findRoom(code){
      const r = await this.client.from('rooms').select('*').eq('id', code.toUpperCase()).maybeSingle();
      return r.data;
    },
    async joinRoom(code, name){
      const room = await this.findRoom(code);
      if (!room) throw new Error('Mesa não encontrada com esse código');
      const e = (await this.client.from('members').upsert({user_id:this.user.id, room_id:room.id, name, role:'player'})).error;
      if (e) throw e;
      return room;
    },
    async getMembership(code){
      const r = await this.client.from('members').select('*').eq('user_id', this.user.id).eq('room_id', code).maybeSingle();
      return r.data;
    },
    async getMembers(code){
      const r = await this.client.from('members').select('*').eq('room_id', code);
      return r.data || [];
    },
    async getCharacter(code){
      const r = await this.client.from('characters').select('*').eq('user_id', this.user.id).eq('room_id', code).maybeSingle();
      return r.data;
    },
    async getAllCharacters(code){
      const r = await this.client.from('characters').select('*').eq('room_id', code);
      return r.data || [];
    },
    async saveCharacter(code, data){
      const e = (await this.client.from('characters').upsert({user_id:this.user.id, room_id:code, data, updated_at:new Date().toISOString()}, {onConflict:'user_id,room_id'})).error;
      if (e) throw e;
    },
    async getFeed(code, limit){
      const r = await this.client.from('feed').select('*').eq('room_id', code).order('id', {ascending:false}).limit(limit||100);
      return (r.data || []).reverse();
    },
    async postFeed(code, entry){
      const e = (await this.client.from('feed').insert({room_id:code, author_name:entry.author, author_id:this.user.id, kind:entry.kind, payload:entry.payload})).error;
      if (e) throw e;
    },
    subscribeFeed(code, cb){
      return this.client.channel('feed:'+code)
        .on('postgres_changes', {event:'INSERT', schema:'public', table:'feed', filter:'room_id=eq.'+code}, p => cb(p.new))
        .subscribe();
    },
    async postCharacterFor(code, ownerId, data){
      const e = (await this.client.from('characters').upsert({user_id:ownerId, room_id:code, data, updated_at:new Date().toISOString()}, {onConflict:'user_id,room_id'})).error;
      if (e) throw e;
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);
